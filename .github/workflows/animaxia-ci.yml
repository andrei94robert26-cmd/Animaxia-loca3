name: Animaxia CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  frontend:
    name: Frontend + Player
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Frontend provider tests
        run: npm run test:frontend-providers

      - name: Lint
        run: npm run lint

      - name: TypeScript typecheck
        run: npx tsc --noEmit --pretty false

  backend-providers:
    name: Backend 8 Providers
    runs-on: ubuntu-24.04

    env:
      TWITCH_PARENT: localhost

    defaults:
      run:
        working-directory: mini-services/animaxia-backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mini-services/animaxia-backend/package-lock.json

      - run: npm ci

      - name: Syntax and security regressions
        run: |
          node --check miner.js
          node --check db.js
          node --check tests/miner-providers.mjs
          node --test tests/p0-auth-player.test.mjs

      - name: Start backend
        run: |
          mkdir -p ../../reports
          npm start > ../../reports/backend.log 2>&1 &
          echo $! > /tmp/animaxia-backend.pid

      - name: Wait for backend
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4000/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat ../../reports/backend.log
          exit 1

      - name: Provider tests 8/8
        run: |
          set -o pipefail
          npm run test:providers 2>&1 | tee ../../reports/backend-providers.txt

      - name: Debug YouTube search
        run: |
          BASE="http:""//127.0.0.1:4000"
          echo "=== FLORIN ==="
          curl -s "$BASE/api/search/advanced?q=Florin%20Cercel"
          echo
          echo "=== YEAR 2026 ==="
          curl -s "$BASE/api/search/advanced?year=2026"
          echo
          echo "=== BACKEND LOG ==="
          tail -n 150 ../../reports/backend.log

      - name: Minimal search 8 providers + year + dedup
        run: |
          set -o pipefail
          node --test tests/minimal-search.test.mjs 2>&1 | tee ../../reports/minimal-search.txt

      - name: Show backend errors on failure
        if: failure()
        run: |
          tail -n 120 ../../reports/backend.log || true

      - name: Upload backend report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: animaxia-backend-provider-report
          path: |
            reports/backend-providers.txt
            reports/backend.log

  backend-metadata:
    name: Backend SQLite metadata + PostgreSQL shadow
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: animaxia_ci
          POSTGRES_USER: animaxia
          POSTGRES_PASSWORD: ephemeral-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U animaxia -d animaxia_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: mini-services/animaxia-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mini-services/animaxia-backend/package-lock.json
      - run: npm ci
      - name: Metadata integration tests
        run: |
          node --check modules/search/metadata.js
          node --check modules/search/content-fts.js
          node --check modules/search/opensearch-outbox.js
          node --check modules/search/opensearch.js
          node --check modules/search/opensearch-routes.js
          node --check modules/search/opensearch-reconcile.js
          node --check modules/search/opensearch-orphans.js
          node --check modules/postgres/shadow-outbox.js
          node --check modules/postgres/shadow.js
          node --check modules/postgres/shadow-read.js
          node --check modules/postgres/shadow-verify.js
          node --check modules/postgres/distributed-shadow.js
          node --check modules/postgres/distributed-pg-worker.js
          node --check cli/postgres-shadow-worker.mjs
          node --check modules/postgres/distributed-shadow.js
          node --check modules/postgres/routes.js
          node --check modules/providers/catalog.js
          node --check modules/providers/fetch.js
          node --check modules/providers/routes.js
          node --check modules/providers/extra-fetch.js
          node --check modules/providers/community-fetch.js
          node --check modules/providers/expansion-fetch.js
          node --check modules/providers/auto-sync.js
          node --check modules/ingest/queue.js
          node --check modules/ingest/source-registry.js
          node --check modules/ingest/source-routes.js
          node --check modules/ingest/service-auth.js
          node --check modules/miner/auto-sync.js
          node --check db.js
          node --test --test-concurrency=1 tests/metadata-search.test.mjs tests/sqlite-advanced.test.mjs tests/ingest-admin-security.test.mjs tests/metadata-batch-import.test.mjs tests/admin-bootstrap.test.mjs tests/metadata-queue.test.mjs tests/miner-auto-sync.test.mjs tests/source-registry.test.mjs tests/content-fts.test.mjs tests/provider-catalog.test.mjs tests/provider-auto-sync.test.mjs tests/community-providers.test.mjs tests/expansion-providers.test.mjs tests/opensearch.test.mjs tests/opensearch-reconcile.test.mjs tests/opensearch-orphans.test.mjs tests/pg-shadow.test.mjs tests/pg-shadow-read.test.mjs tests/pg-shadow-verify.test.mjs

      - name: Live PostgreSQL 16 shadow integration test
        env:
          ANIMAXIA_PG_SHADOW_DATABASE_URL: postgresql://animaxia:ephemeral-ci-only@127.0.0.1:5432/animaxia_ci
          ANIMAXIA_PG_SHADOW_TLS: 'false'
          NODE_ENV: test
        run: node --test tests/pg-shadow-live.test.mjs

      - name: PostgreSQL 16 concurrent workers and transactional replay
        env:
          ANIMAXIA_PG_SHADOW_DATABASE_URL: postgresql://animaxia:ephemeral-ci-only@127.0.0.1:5432/animaxia_ci
          ANIMAXIA_PG_SHADOW_TLS: 'false'
          NODE_ENV: test
        run: node --test tests/pg-distributed-live.test.mjs

  integration:
    name: Final Integration
    needs:
      - frontend
      - backend-providers
      - backend-metadata
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Report verified jobs (not fictional playback assertions)
        run: |
          mkdir -p reports
          printf '%s\\n' "Animaxia CI: frontend and backend-provider jobs completed successfully." "See respective test logs for validated scope." "Live playback across devices was NOT tested by this workflow." > reports/ci-summary.txt

      - uses: actions/upload-artifact@v4
        with:
          name: animaxia-ci-summary
          path: reports/ci-summary.txt
