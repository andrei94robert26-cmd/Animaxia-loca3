# CI — Animaxia Cloud
#
# Continuous integration for every pull request (doc-only *.md PRs are skipped)
# and every push to main. Four jobs:
#   lint         — ESLint (flat config) over the whole repo
#   verify       — scripts/verify-syntax.mjs: syntax-checks every .js/.mjs in
#                  common/, domain/ and services/ via `bun build --no-bundle`
#   test         — canonical test entry (`bun test`)
#   docker-build — build (NOT push) all 10 service images as a matrix,
#                  gated on lint + verify
#
# Nothing is pushed to a registry by this workflow — publishing happens in
# cd-deploy.yml (tag v* or manual dispatch).

name: CI

on:
  pull_request:
    paths:
      - '**'
      - '!**/*.md' # doc-only PRs do not need CI
  push:
    branches: [main]

# Superfluous runs for the same ref (push-fixup races on a PR / rapid pushes to
# main) cancel each other; the newest commit always wins.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ESLint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        # --frozen-lockfile: install exactly the committed dependency graph.
        # FALLBACK: if bun.lock is not (yet) committed at the repo root, bun
        # fails with "lockfile had changes, but lockfile is frozen" — replace
        # this line with a plain `bun install` until the lockfile is committed
        # (committing it is the preferred fix, CI must stay reproducible).
        run: bun install --frozen-lockfile

      - name: Lint
        # The repo carries a FLAT ESLint config (eslint.config.mjs at the repo
        # root, committed by task 2-i — deleting it breaks this job on purpose).
        # With flat config the linted extensions live in the config's `files`
        # patterns; the --ext flag is kept for eslintrc-style compatibility
        # (tolerated by ESLint 10, which bunx resolves).
        # Lint errors — including "couldn't find an ESLint config" if the flat
        # config ever goes missing — MUST fail this job. Do not soften.
        continue-on-error: false
        run: bunx eslint . --ext .js,.mjs

  verify:
    name: Verify (syntax check all modules)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        # Same fallback note as the lint job: drop --frozen-lockfile only until
        # bun.lock is committed.
        run: bun install --frozen-lockfile

      - name: Verify syntax
        # scripts/verify-syntax.mjs (owned by task 2-l) syntax-checks every
        # .js/.mjs file under common/, domain/ and services/ by running each
        # through `bun build --no-bundle`. It exits non-zero on the first
        # syntax error, printing file + message.
        run: node scripts/verify-syntax.mjs

  test:
    name: Unit tests (bun test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        # Same fallback note as the lint job.
        run: bun install --frozen-lockfile

      - name: Run tests
        # Canonical test entry point for the repo. There are deliberately no
        # test files yet — `bun test` exits 1 with "No tests found!" in that
        # case, which we treat as a pass so this step stays the single place
        # tests run from. As soon as **/*.test.js / *.test.mjs files land,
        # real failures fail the job (the "No tests found" bypass no longer
        # matches when tests exist).
        run: |
          set -o pipefail
          if bun test 2>&1 | tee /tmp/bun-test.log; then
            echo "bun test passed."
            exit 0
          fi
          if grep -q "No tests found" /tmp/bun-test.log; then
            echo "::notice::No test files present yet — 'No tests found' treated as pass."
            exit 0
          fi
          echo "::error::bun test reported failures."
          exit 1

  docker-build:
    name: Docker build (${{ matrix.service }})
    needs: [lint, verify]
    runs-on: ubuntu-latest
    strategy:
      # Report every failing image, not just the first — 10 legs in parallel.
      fail-fast: false
      matrix:
        service:
          - gateway-service
          - auth-service
          - content-service
          - ai-service
          - analytics-service
          - search-service
          - premium-service
          - social-service
          - mobile-service
          - queue-service
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build only — no registry login needed because nothing is pushed.
      # The Dockerfiles (BLUEPRINT section 8) always build from the repo ROOT
      # context and live at services/<name>/Dockerfile. The ci-<sha> tag makes
      # the exact commit reproducible if the image is ever re-pushed manually.
      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          push: false
          tags: ghcr.io/animaxia/${{ matrix.service }}:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
