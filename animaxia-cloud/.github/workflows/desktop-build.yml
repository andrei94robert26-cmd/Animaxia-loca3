# desktop-build.yml — FAZA 7 CI: build the Animaxia Desktop (Electron) app and
# publish installers as workflow artifacts (+ GitHub Releases on v* tags).
#
# Additive workflow: the existing ci.yml / cd-deploy.yml / rollback.yml keep
# covering the cloud services; this file only adds the animaxia-desktop/ track.
#
# Matrix:
#   ubuntu-latest   → lint + smoke + typecheck + renderer bundle + Linux AppImage
#   windows-latest  → Windows NSIS installer (.exe)
#   macos-latest    → macOS DMG (.dmg, x64 + arm64)
#
# Notes:
#   • The verify job skips the Electron binary download (ELECTRON_SKIP_BINARY_DOWNLOAD)
#     — lint/smoke/typecheck/vite never launch Electron.
#   • Build jobs install the full toolchain; electron-builder produces the
#     platform installer under animaxia-desktop/release/.
#   • On v* tags every installer is attached to a GitHub Release. Point
#     electron-builder `publish:` (generic feed URL) or this release at your
#     auto-update host — see animaxia-desktop/README.md → Auto-update.

name: desktop-build

on:
  push:
    branches: [main]
    tags: ['v*']
    paths: ['animaxia-desktop/**', '.github/workflows/desktop-build.yml']
  pull_request:
    paths: ['animaxia-desktop/**', '.github/workflows/desktop-build.yml']
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint + smoke + typecheck + renderer build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: animaxia-desktop
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies (no Electron binary)
        run: bun install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: Guard lint
        run: bun run lint

      - name: Smoke suite (IPC parity, deep links, single-flight refresh, packaging)
        run: bun run test:smoke

      - name: Strict typecheck
        run: bun run typecheck

      - name: Renderer production bundle
        run: bun run build:renderer

      - name: Upload renderer bundle
        uses: actions/upload-artifact@v4
        with:
          name: renderer-bundle
          path: animaxia-desktop/dist-renderer
          retention-days: 14

  build:
    name: ${{ matrix.name }} installer
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            script: build:linux
            artifact: 'Animaxia-*.AppImage'
            name: linux-appimage
          - os: windows-latest
            script: build:win
            artifact: 'Animaxia-Setup-*.exe'
            name: windows-installer
          - os: macos-latest
            script: build:mac
            artifact: 'Animaxia-*.dmg'
            name: macos-dmg
    defaults:
      run:
        working-directory: animaxia-desktop
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build ${{ matrix.name }} installer
        run: bun run ${{ matrix.script }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: animaxia-desktop/release/${{ matrix.artifact }}
          retention-days: 30
          if-no-files-found: error

  release:
    name: Attach installers to the GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all installers
        uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: installers/*
          generate_release_notes: true
