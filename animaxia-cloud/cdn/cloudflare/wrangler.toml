# animaxia-edge — Cloudflare Worker config
# Docs: https://developers.cloudflare.com/workers/wrangler/configuration/
#
# The Worker fronts the Animaxia API gateway (services/gateway-service :8080):
# edge caching (Cache API), R2 media for /media/*, KV-driven runtime config,
# origin failover and maintenance mode. See src/worker.js for the full logic.

name = "animaxia-edge"
main = "src/worker.js"
compatibility_date = "2025-01-15"

# Expose the Worker on <name>.<subdomain>.workers.dev for testing.
# `wrangler whoami` shows your subdomain. Turn off once you route the zone
# through the Worker (below) if you don't want the extra public URL.
workers_dev = true

# --- Routes ------------------------------------------------------------------
# Uncomment AFTER the zone (animaxia.com) is on your Cloudflare account and the
# DNS records from terraform/main.tf exist. When a route matches, the Worker
# runs for ALL requests to that pattern (WAF + rate limiting from terraform/
# still run before it — they are separate Cloudflare products).
#
# routes = [
#   { pattern = "animaxia.com/*", zone_name = "animaxia.com" },
#   { pattern = "api.animaxia.com/*", zone_name = "animaxia.com" },
# ]

# --- Bindings ----------------------------------------------------------------
# KV: runtime config ("config" key — seed it from kv/config.example.json via
# scripts/deploy-worker.sh). Create the namespace with
# `wrangler kv namespace create ANIMAXIA_CONFIG` and paste the printed id below.
[[kv_namespaces]]
binding = "ANIMAXIA_CONFIG"
id = "REPLACE_WITH_KV_ID"

# R2: media objects (SVG posters/thumbnails generated by content-service).
# Key = URL path minus "/media/". Upload via scripts/upload-media.sh or
# `wrangler r2 object put animaxia-media/<key> --file <file>`.
[[r2_buckets]]
binding = "ANIMAXIA_MEDIA"
bucket_name = "animaxia-media"

# --- Vars --------------------------------------------------------------------
# Where the Worker proxies to. Point this at YOUR gateway:
#   - public gateway host (e.g. "https://api.animaxia.com" — proxied DNS record
#     from terraform/main.tf points at the gateway's public IP/load balancer)
#   - or any reachable origin (k8s ingress, load balancer, tunnel, ...).
# The default below matches the internal docker/k8s service name and is a
# placeholder for local `wrangler dev` style setups — it must be changed for
# production (Workers run on Cloudflare's edge, not inside your cluster).
[vars]
ORIGIN_URL = "https://gateway.animaxia.internal"

# --- Production notes --------------------------------------------------------
# 1. Secrets: this worker is dependency-free and currently needs NO secrets.
#    If you add any (e.g. a shared token for the gateway), NEVER put them in
#    this file — use:  wrangler secret put MY_SECRET
#    and read them from `env.MY_SECRET` in src/worker.js.
# 2. Terraform (../terraform/) manages the KV namespace + R2 buckets too —
#    keep the ids here in sync with `terraform output` values.
# 3. `wrangler deploy` from this directory; scripts/deploy-worker.sh wraps the
#    full flow (auth check, KV seed, deploy, smoke test).
