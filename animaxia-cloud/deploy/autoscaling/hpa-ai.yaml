# =============================================================================
# Animaxia — AI engines autoscaling (FAZA 22)
# Deployment (animaxia-ai) + HPA (min 2 / max 12, CPU 75%).
# policies.json: ai latencyP95MsTarget 2500ms — LLM/vector workloads are
# long-running, so the CPU target is relaxed to 75%. LATENCY-BASED SCALING
# (the real lever for AI): the p95 latency target is consumed by the
# autoscale simulator (autoscale-sim.mjs) and can be wired as a custom
# metric (PodMonitor p95 → HPA external metric) once FAZA 23 observability
# is active; until then the HPA below scales on CPU while the simulator
# models the latency decisions.
# NOTE: infrastructure only — the AI modules (protected) are NOT modified.
# =============================================================================
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: animaxia-ai
  namespace: animaxia-core
  labels:
    app.kubernetes.io/name: animaxia-ai
    app.kubernetes.io/part-of: animaxia-cloud
    app.kubernetes.io/component: ai-engines
spec:
  # HPA owns the replica count; this is the initial value.
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: animaxia-ai
  template:
    metadata:
      labels:
        app.kubernetes.io/name: animaxia-ai
        app.kubernetes.io/part-of: animaxia-cloud
        app.kubernetes.io/component: ai-engines
    spec:
      containers:
        - name: animaxia-ai
          image: animaxia/ai:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 4000
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            # AI inference benefits from roomier limits.
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: animaxia-ai
  namespace: animaxia-core
  labels:
    app.kubernetes.io/name: animaxia-ai
    app.kubernetes.io/part-of: animaxia-cloud
    app.kubernetes.io/component: ai-engines
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: animaxia-ai
  minReplicas: 2
  maxReplicas: 12
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
  behavior:
    scaleUp:
      # LLM latency spikes need faster headroom than plain APIs.
      stabilizationWindowSeconds: 60
      selectPolicy: Max
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
    scaleDown:
      # Slow drain — cold LLM workers are expensive to re-warm.
      stabilizationWindowSeconds: 300
      selectPolicy: Min
      policies:
        - type: Percent
          value: 20
          periodSeconds: 120
