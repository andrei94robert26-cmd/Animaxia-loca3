# =============================================================================
# Animaxia — core backend autoscaling (FAZA 22)
# Namespace + Deployment (animaxia-backend) + HPA + PDB.
#   • HPA: min 2 / max 20 pods, CPU targetAverageUtilization 70%,
#     memory 75%; scaleUp stabilization 60s, scaleDown 300s (per
#     deploy/autoscaling/policies.json: backend, latencyP95MsTarget 800).
#   • PDB: minAvailable 1 — one pod may always be drained during node
#     maintenance without dropping the API floor.
# NOTE: this manifest is infrastructure only — the backend code (protected,
# FAZA 18/20/21) is NOT modified. Health probes hit the existing
# /api/health endpoint.
# =============================================================================
---
apiVersion: v1
kind: Namespace
metadata:
  name: animaxia-core
  labels:
    app.kubernetes.io/part-of: animaxia-cloud
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: animaxia-backend
  namespace: animaxia-core
  labels:
    app.kubernetes.io/name: animaxia-backend
    app.kubernetes.io/part-of: animaxia-cloud
    app.kubernetes.io/component: core-backend
spec:
  # HPA owns the replica count; this is the initial value.
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: animaxia-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: animaxia-backend
        app.kubernetes.io/part-of: animaxia-cloud
        app.kubernetes.io/component: core-backend
    spec:
      containers:
        - name: animaxia-backend
          image: animaxia/backend:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 4000
              protocol: TCP
          # Probes hit the EXISTING /api/health route (no backend change).
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: animaxia-backend
  namespace: animaxia-core
  labels:
    app.kubernetes.io/name: animaxia-backend
    app.kubernetes.io/part-of: animaxia-cloud
    app.kubernetes.io/component: core-backend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: animaxia-backend
  minReplicas: 2
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      selectPolicy: Max
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
    scaleDown:
      # Slow scale-down: keep headroom for traffic waves.
      stabilizationWindowSeconds: 300
      selectPolicy: Min
      policies:
        - type: Percent
          value: 25
          periodSeconds: 120
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: animaxia-backend
  namespace: animaxia-core
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: animaxia-backend
