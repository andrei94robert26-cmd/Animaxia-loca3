# =============================================================================
# Animaxia — frontend (Next.js SSR) autoscaling (FAZA 22)
# Deployment (animaxia-frontend) + HPA (min 2 / max 16, CPU 65%).
# STATIC ASSETS ARE SERVED BY THE CDN / EDGE ANYCAST (Cloudflare cache rules
# + R2 media) — this deployment only runs the Next.js SSR server
# (127.0.0.1:3000 behind the origin Caddyfile). That is why the CPU target
# is the tightest of the fleet (65): SSR render latency is user-visible on
# every navigation that misses the edge cache.
# NOTE: infrastructure only — the frontend (src/, protected) is NOT modified.
# =============================================================================
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: animaxia-frontend
  namespace: animaxia-core
  labels:
    app.kubernetes.io/name: animaxia-frontend
    app.kubernetes.io/part-of: animaxia-cloud
    app.kubernetes.io/component: frontend-ssr
spec:
  # HPA owns the replica count; this is the initial value.
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: animaxia-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: animaxia-frontend
        app.kubernetes.io/part-of: animaxia-cloud
        app.kubernetes.io/component: frontend-ssr
    spec:
      containers:
        - name: animaxia-frontend
          image: animaxia/frontend:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: animaxia-frontend
  namespace: animaxia-core
  labels:
    app.kubernetes.io/name: animaxia-frontend
    app.kubernetes.io/part-of: animaxia-cloud
    app.kubernetes.io/component: frontend-ssr
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: animaxia-frontend
  minReplicas: 2
  maxReplicas: 16
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      selectPolicy: Max
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      selectPolicy: Min
      policies:
        - type: Percent
          value: 25
          periodSeconds: 120
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: animaxia-frontend
  namespace: animaxia-core
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: animaxia-frontend
