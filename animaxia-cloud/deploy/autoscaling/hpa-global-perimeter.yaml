# =============================================================================
# Animaxia — global perimeter autoscaling (FAZA 22)
# Deployment (animaxia-global-gateway, :4040) + HPA (min 2 / max 10, CPU 60%).
# policies.json: global-gateway latencyP95MsTarget 150ms — the perimeter sits
# in front of EVERYTHING, so it gets the tightest CPU target of the fleet.
# REDIS-GLOBAL NOTE: the perimeter's shared state (distributed rate-limit,
# cooldown, anti-spam, /api/search + /api/hub cache) lives in the Upstash
# Redis global group (domain/redis/) — scaling pods is safe at any replica
# count because the counters do NOT live in pod memory (see the local
# validation twin mini-services/redis-global:4030; RESP-identical).
# NOTE: infrastructure only — mini-services/global-gateway (protected,
# another agent) is NOT modified.
# =============================================================================
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: animaxia-global-gateway
  namespace: animaxia-core
  labels:
    app.kubernetes.io/name: animaxia-global-gateway
    app.kubernetes.io/part-of: animaxia-cloud
    app.kubernetes.io/component: global-perimeter
spec:
  # HPA owns the replica count; this is the initial value.
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: animaxia-global-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: animaxia-global-gateway
        app.kubernetes.io/part-of: animaxia-cloud
        app.kubernetes.io/component: global-perimeter
    spec:
      containers:
        - name: animaxia-global-gateway
          image: animaxia/global-gateway:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 4040
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: animaxia-global-gateway
  namespace: animaxia-core
  labels:
    app.kubernetes.io/name: animaxia-global-gateway
    app.kubernetes.io/part-of: animaxia-cloud
    app.kubernetes.io/component: global-perimeter
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: animaxia-global-gateway
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
  behavior:
    scaleUp:
      # The perimeter must never be the bottleneck — fast scale-up.
      stabilizationWindowSeconds: 60
      selectPolicy: Max
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      selectPolicy: Min
      policies:
        - type: Percent
          value: 25
          periodSeconds: 120
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: animaxia-global-gateway
  namespace: animaxia-core
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: animaxia-global-gateway
