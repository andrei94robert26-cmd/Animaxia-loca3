# =============================================================================
# Animaxia — realtime service autoscaling (FAZA 22)
# Deployment (animaxia-realtime, :4010) + HPA (min 2 / max 10, CPU 70%).
# policies.json: realtime latencyP95MsTarget 200ms — WebSocket traffic is
# latency-sensitive, so the CPU target stays at 70 and the PDB keeps one
# pod always available for live connections to re-home onto.
# NOTE: infrastructure only — mini-services/animaxia-realtime (protected,
# another agent) is NOT modified.
# =============================================================================
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: animaxia-realtime
  namespace: animaxia-core
  labels:
    app.kubernetes.io/name: animaxia-realtime
    app.kubernetes.io/part-of: animaxia-cloud
    app.kubernetes.io/component: realtime
spec:
  # HPA owns the replica count; this is the initial value.
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: animaxia-realtime
  template:
    metadata:
      labels:
        app.kubernetes.io/name: animaxia-realtime
        app.kubernetes.io/part-of: animaxia-cloud
        app.kubernetes.io/component: realtime
    spec:
      containers:
        - name: animaxia-realtime
          image: animaxia/realtime:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 4010
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: animaxia-realtime
  namespace: animaxia-core
  labels:
    app.kubernetes.io/name: animaxia-realtime
    app.kubernetes.io/part-of: animaxia-cloud
    app.kubernetes.io/component: realtime
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: animaxia-realtime
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      selectPolicy: Max
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      selectPolicy: Min
      policies:
        - type: Percent
          value: 25
          periodSeconds: 120
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: animaxia-realtime
  namespace: animaxia-core
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: animaxia-realtime
