# =============================================================================
# Animaxia Cloud — observability stack overlay (agent 2-j / BLUEPRINT §11)
# =============================================================================
# Merged onto the main stack (same project + `animaxia` network):
#
#   cd deploy/docker
#   docker compose -f docker-compose.yml -f docker-compose.observability.yml up -d
#
# Brings up: Prometheus, Grafana, Loki, Promtail, OpenTelemetry Collector, Tempo.
# Grafana is published on host port 3001 (NOT 3000 — the Next.js frontend owns 3000).
#
# Linux note: when the 10 services run on the HOST (bun run dev) instead of in
# Docker, uncomment the `extra_hosts` line below so `host.docker.internal`
# resolves, then switch the Prometheus jobs to the -host profile documented in
# observability/prometheus/prometheus.yml.
# =============================================================================

services:
  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: animaxia-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ../../observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../../observability/prometheus/rules:/etc/prometheus/rules:ro
    networks: [animaxia]
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:11.5.1
    container_name: animaxia-grafana
    restart: unless-stopped
    ports:
      - "3001:3000" # host 3001 — 3000 belongs to the Next.js frontend
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ../../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../../observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks: [animaxia]
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  loki:
    image: grafana/loki:3.4.1
    container_name: animaxia-loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - ../../observability/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    networks: [animaxia]
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3100/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  promtail:
    image: grafana/promtail:3.4.1
    container_name: animaxia-promtail
    restart: unless-stopped
    volumes:
      - ../../observability/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [animaxia]
    depends_on:
      - loki

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.119.0
    container_name: animaxia-otel-collector
    restart: unless-stopped
    ports:
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP (services default OTELENDPOINT → http://otel-collector:4318/v1/traces)
    volumes:
      - ../../observability/otel/otel-collector-config.yml:/etc/otelcol-contrib/config.yaml:ro
    networks: [animaxia]
    # :8889 (Prometheus exporter) intentionally NOT published — internal only.

  tempo:
    image: grafana/tempo:2.7.0
    container_name: animaxia-tempo
    restart: unless-stopped
    ports:
      - "3200:3200" # Tempo API (Grafana Explore → Tempo)
    volumes:
      - ../../observability/tempo/tempo-config.yml:/etc/tempo/tempo-config.yml:ro
      - tempo-data:/var/tempo
    networks: [animaxia]
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3200/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  animaxia:
    # Same network as the main compose file — merging shares it.
    name: animaxia
    driver: bridge

volumes:
  loki-data:
  tempo-data:
