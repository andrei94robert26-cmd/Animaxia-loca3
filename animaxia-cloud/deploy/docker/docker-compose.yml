    # ports: ["4005:4005"]   # debug: expose directly on the host (see bottom)
    # mem_limit: 512m        # resource hint — see header note

  # ── premium-service :4006 — plans + Stripe sandbox checkout ───────────────
  premium-service:
    build:
      context: ../..
      dockerfile: services/premium-service/Dockerfile
    image: ghcr.io/animaxia/premium-service:local
    container_name: animaxia-premium-service
