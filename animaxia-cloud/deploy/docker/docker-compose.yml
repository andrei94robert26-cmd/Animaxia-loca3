      context: ../..
      dockerfile: services/mobile-service/Dockerfile
    image: ghcr.io/animaxia/mobile-service:local
    container_name: animaxia-mobile-service
    restart: unless-stopped
    env_file: ../../.env
    environment:
      PORT: "4008"
      AUTHSERVICEURL: http://auth-service:4001
      CONTENTSERVICEURL: http://content-service:4002
      AISERVICEURL: http://ai-service:4003
