# =============================================================================
# Animaxia Cloud — full local development stack (BLUEPRINT §2 + §8)
# =============================================================================
# 10 microservices on the `animaxia` bridge network. Only the gateway is
# exposed to the host (http://localhost:8080); the services find each other
# through Docker DNS via the *SERVICEURL overrides below (consumed by
# @animaxia/common/services.js serviceUrl()).
#
# PREREQ — create the repo root .env first (compose fails fast without it):
#     cd /path/to/animaxia-cloud && cp .env.example .env
#     # then fill in DATABASEURL (external Postgres, e.g. Neon) etc.
#
# BUILD & RUN (from this directory):
#     docker compose up -d --build
#
# SMOKE TEST:
#     curl http://localhost:8080/api/health     # aggregated fan-out health
#
# OBSERVABILITY STACK (agent 2-j owns docker-compose.observability.yml in this
# same folder — Prometheus, Grafana, Loki + promtail, OTel Collector, Tempo).
# Merge it on top of this file to bring the full stack up:
#     docker compose -f docker-compose.yml -f docker-compose.observability.yml up -d
# OTELSENDPOINT below already points at http://otel-collector:4318/v1/traces,
# so traces flow as soon as the collector is running. Trace export is
# fire-and-forget (@animaxia/common/telemetry.js), so services stay healthy
# when the observability overlay is NOT running.
#
# RESOURCE LIMITS — every service carries a commented `mem_limit` hint
# (512m per microservice, 256m gateway). Plain `docker compose` (non-swarm)
# enforces `mem_limit` directly; the swarm-style equivalent, for reference, is:
#     deploy:
#       resources:
#         limits:
#           memory: 512m
#
# DEBUG PROFILE — see the commented block at the bottom of this file for
# exposing service ports (4001-4009) directly on the host.
#
# NOTE — per-service Dockerfiles live at services/<name>/Dockerfile (one copy
# of deploy/docker/Dockerfile.template each, owned by the service agents).
# This file does NOT create them; build context is always the repo root.
# =============================================================================

name: animaxia-cloud

services:
  # ── API gateway :8080 — the only host-exposed service ─────────────────────
  gateway-service:
    build:
      context: ../..                                  # repo root (BLUEPRINT §8)
      dockerfile: services/gateway-service/Dockerfile
    image: ghcr.io/animaxia/gateway-service:local     # CI pushes :sha / :latest
    container_name: animaxia-gateway-service
    restart: unless-stopped
    env_file: ../../.env
    environment:
      PORT: "8080"
      # Inter-service base URLs — Docker DNS inside the `animaxia` network:
      AUTHSERVICEURL: http://auth-service:4001
      CONTENTSERVICEURL: http://content-service:4002
      AISERVICEURL: http://ai-service:4003
      ANALYTICSSERVICEURL: http://analytics-service:4004
      SEARCHSERVICEURL: http://search-service:4005
      PREMIUMSERVICEURL: http://premium-service:4006
      SOCIALSERVICEURL: http://social-service:4007
      MOBILESERVICEURL: http://mobile-service:4008
      QUEUESERVICEURL: http://queue-service:4009
      # OTel Collector from docker-compose.observability.yml (agent 2-j);
      # fire-and-forget exporter — safe when the overlay is down.
      OTELSENDPOINT: http://otel-collector:4318/v1/traces
    ports:
      - "8080:8080"                                   # gateway → host
    depends_on:
      auth-service:
        condition: service_healthy
      content-service:
        condition: service_healthy
      ai-service:
        condition: service_healthy
      analytics-service:
        condition: service_healthy
      search-service:
        condition: service_healthy
      premium-service:
        condition: service_healthy
      social-service:
        condition: service_healthy
      mobile-service:
        condition: service_healthy
      queue-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - animaxia
    # mem_limit: 256m    # resource hint — see header note

  # ── auth-service :4001 — JWT sessions, users, profiles, security ──────────
  # Leaf services have NO depends_on on purpose: each one only needs the
  # external Postgres (DATABASEURL) to boot, so the whole mesh starts in
  # parallel; cross-service calls go through serviceFetch() + circuit
  # breakers and tolerate upstreams that are still warming up.
  auth-service:
    build:
      context: ../..
      dockerfile: services/auth-service/Dockerfile
    image: ghcr.io/animaxia/auth-service:local
    container_name: animaxia-auth-service
    restart: unless-stopped
    env_file: ../../.env
    environment:
      PORT: "4001"
      AUTHSERVICEURL: http://auth-service:4001
      CONTENTSERVICEURL: http://content-service:4002
      AISERVICEURL: http://ai-service:4003
      ANALYTICSSERVICEURL: http://analytics-service:4004
      SEARCHSERVICEURL: http://search-service:4005
      PREMIUMSERVICEURL: http://premium-service:4006
      SOCIALSERVICEURL: http://social-service:4007
      MOBILESERVICEURL: http://mobile-service:4008
      QUEUESERVICEURL: http://queue-service:4009
      OTELSENDPOINT: http://otel-collector:4318/v1/traces
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:4001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - animaxia
    # ports: ["4001:4001"]   # debug: expose directly on the host (see bottom)
    # mem_limit: 512m        # resource hint — see header note

  # ── content-service :4002 — providers, miner, player, cache, seed ─────────
  content-service:
    build:
      context: ../..
      dockerfile: services/content-service/Dockerfile
    image: ghcr.io/animaxia/content-service:local
    container_name: animaxia-content-service
    restart: unless-stopped
    env_file: ../../.env
    environment:
      PORT: "4002"
      AUTHSERVICEURL: http://auth-service:4001
      CONTENTSERVICEURL: http://content-service:4002
      AISERVICEURL: http://ai-service:4003
      ANALYTICSSERVICEURL: http://analytics-service:4004
      SEARCHSERVICEURL: http://search-service:4005
      PREMIUMSERVICEURL: http://premium-service:4006
      SOCIALSERVICEURL: http://social-service:4007
      MOBILESERVICEURL: http://mobile-service:4008
      QUEUESERVICEURL: http://queue-service:4009
      OTELSENDPOINT: http://otel-collector:4318/v1/traces
    volumes:
      # Local fallback store + generated thumbnails (survives recreation).
      # The image should create /app/data owned by uid 10001 (animaxia) so
      # the named volume inherits writable permissions on first use.
      - animaxia-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:4002/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - animaxia
    # ports: ["4002:4002"]   # debug: expose directly on the host (see bottom)
    # mem_limit: 512m        # resource hint — see header note

  # ── ai-service :4003 — AI router, chat, recommendations ───────────────────
  ai-service:
    build:
      context: ../..
      dockerfile: services/ai-service/Dockerfile
    image: ghcr.io/animaxia/ai-service:local
    container_name: animaxia-ai-service
    restart: unless-stopped
    env_file: ../../.env
    environment:
      PORT: "4003"
      AUTHSERVICEURL: http://auth-service:4001
      CONTENTSERVICEURL: http://content-service:4002
      AISERVICEURL: http://ai-service:4003
      ANALYTICSSERVICEURL: http://analytics-service:4004
      SEARCHSERVICEURL: http://search-service:4005
      PREMIUMSERVICEURL: http://premium-service:4006
      SOCIALSERVICEURL: http://social-service:4007
      MOBILESERVICEURL: http://mobile-service:4008
      QUEUESERVICEURL: http://queue-service:4009
      # Phase 4 — Animaxia AI Cloud (llm-core provider chain + pluggable
      # vector backends; consumed by domain/aicloud/* in this service).
      AI_PROVIDER: ${AI_PROVIDER:-z-ai}
      AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
      AI_TIMEOUTMS: ${AI_TIMEOUTMS:-25000}
      VECTOR_BACKEND: ${VECTOR_BACKEND:-auto}
      AI_API_KEY: ${AI_API_KEY:-}
      QDRANTURL: ${QDRANTURL:-}
      QDRANTAPIKEY: ${QDRANTAPIKEY:-}
      PINECONEURL: ${PINECONEURL:-}
      PINECONEAPIKEY: ${PINECONEAPIKEY:-}
      OTELSENDPOINT: http://otel-collector:4318/v1/traces
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:4003/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - animaxia
    # ports: ["4003:4003"]   # debug: expose directly on the host (see bottom)
    # mem_limit: 512m        # resource hint — see header note

  # ── analytics-service :4004 — views, trending, rollups, admin overview ────
  analytics-service:
    build:
      context: ../..
      dockerfile: services/analytics-service/Dockerfile
    image: ghcr.io/animaxia/analytics-service:local
