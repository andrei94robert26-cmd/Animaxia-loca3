      CONTENTSERVICEURL: http://content-service:4002
      AISERVICEURL: http://ai-service:4003
      ANALYTICSSERVICEURL: http://analytics-service:4004
      SEARCHSERVICEURL: http://search-service:4005
      PREMIUMSERVICEURL: http://premium-service:4006
      SOCIALSERVICEURL: http://social-service:4007
      MOBILESERVICEURL: http://mobile-service:4008
      QUEUESERVICEURL: http://queue-service:4009
      OTELSENDPOINT: http://otel-collector:4318/v1/traces
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:4004/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - animaxia
    # ports: ["4004:4004"]   # debug: expose directly on the host (see bottom)
    # mem_limit: 512m        # resource hint — see header note

  # ── search-service :4005 — Animaxia search engine + reindex worker ────────
  search-service:
    build:
      context: ../..
      dockerfile: services/search-service/Dockerfile
    image: ghcr.io/animaxia/search-service:local
    container_name: animaxia-search-service
    restart: unless-stopped
    env_file: ../../.env
    environment:
      PORT: "4005"
      AUTHSERVICEURL: http://auth-service:4001
      CONTENTSERVICEURL: http://content-service:4002
      AISERVICEURL: http://ai-service:4003
      ANALYTICSSERVICEURL: http://analytics-service:4004
      SEARCHSERVICEURL: http://search-service:4005
      PREMIUMSERVICEURL: http://premium-service:4006
      SOCIALSERVICEURL: http://social-service:4007
      MOBILESERVICEURL: http://mobile-service:4008
      QUEUESERVICEURL: http://queue-service:4009
