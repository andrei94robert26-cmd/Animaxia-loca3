      # the named volume inherits writable permissions on first use.
      - animaxia-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:4009/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - animaxia
    # ports: ["4009:4009"]   # debug: expose directly on the host (see bottom)
    # mem_limit: 512m        # resource hint — see header note

# ── top-level ────────────────────────────────────────────────────────────────
networks:
  animaxia:
    driver: bridge

volumes:
  animaxia-data:

# =============================================================================
# DEBUG PROFILE — expose service ports directly on the host (commented)
# =============================================================================
# By default the stack is gateway-only: everything goes through
# http://localhost:8080. To hit a microservice directly from the host (e.g.
# its /metrics or /health), either:
#
#   1) uncomment the `ports:` hint on that service above and recreate it:
#        docker compose up -d content-service
#
#   2) or keep this file pristine and put the exposure behind a debug profile
#      in a `docker-compose.debug.yml` overlay in this folder:
#
#        # docker-compose.debug.yml
#        services:
#          auth-service:
#            profiles: [debug]          # only starts with --profile debug
#            ports: ["4001:4001"]
#          content-service:
#            profiles: [debug]
#            ports: ["4002:4002"]
#          ai-service:
#            profiles: [debug]
#            ports: ["4003:4003"]
#          analytics-service:
#            profiles: [debug]
#            ports: ["4004:4004"]
#          search-service:
#            profiles: [debug]
#            ports: ["4005:4005"]
#          premium-service:
#            profiles: [debug]
#            ports: ["4006:4006"]
#          social-service:
#            profiles: [debug]
#            ports: ["4007:4007"]
#          mobile-service:
#            profiles: [debug]
#            ports: ["4008:4008"]
#          queue-service:
#            profiles: [debug]
#            ports: ["4009:4009"]
#
#      then start the stack + debug ports together:
#        docker compose -f docker-compose.yml -f docker-compose.debug.yml \
#          --profile debug up -d
#
# Profile semantics worth knowing: a service tagged `profiles: [debug]` is
# SKIPPED by plain `docker compose up` and only runs when the profile is
# enabled — which is exactly why the debug exposure lives in a separate
# overlay (or as the commented `ports` hints above) instead of on the
# always-on service stanzas.
#
# Observability note: the same overlay mechanism brings up the monitoring
# stack owned by agent 2-j (docker-compose.observability.yml, this folder):
#   docker compose -f docker-compose.yml -f docker-compose.observability.yml up -d
# =============================================================================
