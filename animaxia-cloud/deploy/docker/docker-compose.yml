      CONTENTSERVICEURL: http://content-service:4002
      AISERVICEURL: http://ai-service:4003
      ANALYTICSSERVICEURL: http://analytics-service:4004
      SEARCHSERVICEURL: http://search-service:4005
      PREMIUMSERVICEURL: http://premium-service:4006
