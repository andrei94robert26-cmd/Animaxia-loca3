{{/* Ingress — the gateway-service is the ONLY public entrypoint. */}}
{{- if .Values.ingress.enabled }}
{{- $gatewayName := include "animaxia.serviceName" (dict "root" . "key" "gateway" "service" (.Values.services.gateway | default dict)) }}
{{- $gatewayPort := (.Values.services.gateway | default dict).port | default 8080 }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "animaxia.fullname" . }}-gateway
  namespace: {{ include "animaxia.namespace" . }}
  labels:
    {{- include "animaxia.labels" (dict "root" . "serviceName" $gatewayName "component" "ingress") | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $gatewayName }}
                port:
                  number: {{ $gatewayPort }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.host | quote }}
      {{- with .Values.ingress.tls.secretName }}
      secretName: {{ . }}
      {{- end }}
  {{- end }}
{{- end }}
