{{/* =============================================================================
Secret template — ONLY rendered when `existingSecret` is empty.

PREFERRED: create the Secret out-of-band and point `existingSecret` at it:
  kubectl -n animaxia create secret generic animaxia-secrets \
    --from-literal=DATABASEURL=... --from-literal=AUTHSECRET=... ...

Values set via env.secret land in Helm release metadata (stored unencrypted in
cluster Secrets of type helm.sh/release.v1) — fine for dev, not for production.

Phase-4 AI Cloud secrets (AI_API_KEY, QDRANTAPIKEY, PINECONEAPIKEY) flow
through env.secret like every other key — set them under env.secret in
values.yaml, or add them to the out-of-band existingSecret (BLUEPRINT §11).
============================================================================= */}}
{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "animaxia.secretName" . }}
  namespace: {{ include "animaxia.namespace" . }}
  labels:
    {{- include "animaxia.labels" (dict "root" . "component" "config") | nindent 4 }}
  annotations:
    animaxia.io/template: "true"
type: Opaque
stringData:
{{- range $key, $value := .Values.env.secret }}
  {{ $key }}: {{ $value | quote }}
{{- end }}
{{- end }}
