{{/* Shared ServiceAccount used by every Animaxia Deployment. */}}
{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "animaxia.fullname" . }}
  namespace: {{ include "animaxia.namespace" . }}
  labels:
    {{- include "animaxia.labels" (dict "root" . "component" "serviceaccount") | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
