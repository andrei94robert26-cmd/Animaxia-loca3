# =============================================================================
# Animaxia Cloud — secrets TEMPLATE (Secret "animaxia-secrets")
#
# *** DO NOT COMMIT REAL VALUES ***
# `kubectl create secret ... --from-literal=...` is preferred; this file is a
# template only. Replace every REPLACE_ME before applying, or (better) create
# the Secret out-of-band and never apply this file at all:
#
#   kubectl -n animaxia create secret generic animaxia-secrets \
#     --from-literal=DATABASEURL='postgresql://user:pass@host/db?sslmode=require' \
#     --from-literal=AUTHSECRET="$(openssl rand -hex 32)" \
#     --from-literal=TMDBAPIKEY='<tmdb-key>' \
#     --from-literal=STRIPESECRETKEY='sk_live_...' \
#     --from-literal=FOOTBALLDATAAPI_KEY='<football-data-key>' \
#     --from-literal=ADMINEMAILS='admin@animaxia.local' \
#     --from-literal=AI_API_KEY='<openai-key>' \
#     --from-literal=QDRANTAPIKEY='<qdrant-key>' \
#     --from-literal=PINECONEAPIKEY='<pinecone-key>' \
#     --from-literal=OTELSENDPOINT='http://otel-collector.observability.svc.cluster.local:4318/v1/traces'
#
# NOTE: the trace endpoint key is OTELSENDPOINT (house style, matches
# .env.example and common/telemetry.js) — not OTELENDPOINT.
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: animaxia-secrets
  namespace: animaxia
  labels:
    app.kubernetes.io/name: animaxia
    app.kubernetes.io/part-of: animaxia-cloud
    app.kubernetes.io/component: config
  annotations:
    # marker so tooling can warn when template placeholders are still present
    animaxia.io/template: "true"
type: Opaque
stringData:
  # Neon Postgres connection string (never commit real values)
  DATABASEURL: "REPLACE_ME"
  # JWT signing secret (HS256) — 32+ random bytes
  AUTHSECRET: "REPLACE_ME"
  # TMDB API key (v3)
  TMDBAPIKEY: "REPLACE_ME"
  # Stripe secret key (sk_test_... / sk_live_...)
  STRIPESECRETKEY: "REPLACE_ME"
  # football-data.org API key
  FOOTBALLDATAAPI_KEY: "REPLACE_ME"
  # comma-separated bootstrap admin emails
  ADMINEMAILS: "REPLACE_ME"
  # Phase 4 — Animaxia AI Cloud: openai-compatible llm-core key (empty when
  # AI_PROVIDER=z-ai/mock) + external vector adapter keys (QDRANTURL /
  # PINECONEURL are non-secret — see 01-configmap.yaml)
  AI_API_KEY: ""
  QDRANTAPIKEY: ""
  PINECONEAPIKEY: ""
  # OTLP/HTTP trace export endpoint (in-cluster otel-collector)
  OTELSENDPOINT: "http://otel-collector.observability.svc.cluster.local:4318/v1/traces"
