# =============================================================================
# Animaxia Cloud — gateway-service (:8080)
# API gateway: proxies /api/* to the 9 upstream services, exposes
# /api/health (aggregated) + /api/gateway/* (routes, breakers, edge-cache).
# Deployment + ClusterIP Service + HorizontalPodAutoscaler.
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-service
  namespace: animaxia
  labels:
    app.kubernetes.io/name: gateway-service
    app.kubernetes.io/part-of: animaxia-cloud
    app.kubernetes.io/component: api-gateway
spec:
  # HPA owns replica count once autoscaling is running; this is the initial value
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: gateway-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gateway-service
        app.kubernetes.io/part-of: animaxia-cloud
        app.kubernetes.io/component: api-gateway
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: gateway-service
          image: ghcr.io/animaxia/gateway-service:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: metrics
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: animaxia-config
            - secretRef:
                name: animaxia-secrets
          env:
            - name: PORT
              value: "8080"
            - name: SERVICENAME
              value: "gateway-service"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-service
  namespace: animaxia
  labels:
    app.kubernetes.io/name: gateway-service
    app.kubernetes.io/part-of: animaxia-cloud
    app.kubernetes.io/component: api-gateway
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: gateway-service
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: gateway-service
  namespace: animaxia
  labels:
    app.kubernetes.io/name: gateway-service
    app.kubernetes.io/part-of: animaxia-cloud
    app.kubernetes.io/component: api-gateway
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: gateway-service
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
