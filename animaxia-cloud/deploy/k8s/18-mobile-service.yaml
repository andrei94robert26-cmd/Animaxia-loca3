# =============================================================================
# Animaxia Cloud — mobile-service (:4008)
# Mobile BFF: compact home rows, player resolution, profile digest, config/feature flags.
# Gateway prefixes: /api/mobile
# Deployment + ClusterIP Service + HorizontalPodAutoscaler.
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mobile-service
  namespace: animaxia
  labels:
    app.kubernetes.io/name: mobile-service
    app.kubernetes.io/part-of: animaxia-cloud
    app.kubernetes.io/component: mobile-bff
spec:
  # HPA owns replica count once autoscaling is running; this is the initial value
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: mobile-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mobile-service
        app.kubernetes.io/part-of: animaxia-cloud
        app.kubernetes.io/component: mobile-bff
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "4008"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: mobile-service
          image: ghcr.io/animaxia/mobile-service:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 4008
              protocol: TCP
            - name: metrics
              containerPort: 4008
              protocol: TCP
          envFrom:
            - configMapRef:
                name: animaxia-config
            - secretRef:
                name: animaxia-secrets
          env:
            - name: PORT
              value: "4008"
            - name: SERVICENAME
              value: "mobile-service"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: mobile-service
  namespace: animaxia
  labels:
    app.kubernetes.io/name: mobile-service
    app.kubernetes.io/part-of: animaxia-cloud
    app.kubernetes.io/component: mobile-bff
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: mobile-service
  ports:
    - name: http
      port: 4008
      targetPort: http
      protocol: TCP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: mobile-service
  namespace: animaxia
  labels:
    app.kubernetes.io/name: mobile-service
    app.kubernetes.io/part-of: animaxia-cloud
    app.kubernetes.io/component: mobile-bff
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: mobile-service
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      # avoid flapping; queue-service especially dislikes replica churn
      stabilizationWindowSeconds: 300
