# =============================================================================
# Animaxia Cloud — queue-service (:4009)
# Postgres-backed durable queue (FOR UPDATE SKIP LOCKED, leases, retries), job workers (miner/prefetch/thumbnails/refresh), internal cron scheduler + /api/workers compat API.
# Gateway prefixes: /api/queue, /api/workers
# Deployment + ClusterIP Service + HorizontalPodAutoscaler.
# Mounts the shared "animaxia-data" PVC (see 04-pvc.yaml) at /app/data.
# Extra pod label role=worker-consumer (worker/consumer role for NetworkPolicies / dashboards).
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: queue-service
  namespace: animaxia
  labels:
    app.kubernetes.io/name: queue-service
    app.kubernetes.io/part-of: animaxia-cloud
    app.kubernetes.io/component: queue
    role: worker-consumer
spec:
  # HPA owns replica count once autoscaling is running; this is the initial value
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: queue-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: queue-service
        app.kubernetes.io/part-of: animaxia-cloud
        app.kubernetes.io/component: queue
        role: worker-consumer
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "4009"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      # shared data volume (RWO — see 04-pvc.yaml for multi-AZ notes)
      volumes:
        - name: animaxia-data
          persistentVolumeClaim:
            claimName: animaxia-data
      containers:
        - name: queue-service
          image: ghcr.io/animaxia/queue-service:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 4009
              protocol: TCP
            - name: metrics
              containerPort: 4009
              protocol: TCP
          envFrom:
            - configMapRef:
                name: animaxia-config
            - secretRef:
                name: animaxia-secrets
          env:
            - name: PORT
              value: "4009"
            - name: SERVICENAME
              value: "queue-service"
            - name: LOCALDATADIR
              value: "/app/data"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: animaxia-data
              mountPath: /app/data
---
apiVersion: v1
kind: Service
metadata:
  name: queue-service
  namespace: animaxia
  labels:
    app.kubernetes.io/name: queue-service
    app.kubernetes.io/part-of: animaxia-cloud
    app.kubernetes.io/component: queue
    role: worker-consumer
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: queue-service
  ports:
    - name: http
      port: 4009
      targetPort: http
      protocol: TCP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: queue-service
  namespace: animaxia
  labels:
    app.kubernetes.io/name: queue-service
    app.kubernetes.io/part-of: animaxia-cloud
    app.kubernetes.io/component: queue
    role: worker-consumer
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: queue-service
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      # avoid flapping; queue-service especially dislikes replica churn
      stabilizationWindowSeconds: 300
