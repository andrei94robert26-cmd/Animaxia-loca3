# desktop-ci.yml — standalone CI for the animaxia-desktop folder.
#
# This twin of animaxia-cloud/.github/workflows/desktop-build.yml activates when
# animaxia-desktop is pushed as its OWN repository (the cloud-monorepo variant
# lives one level up and uses working-directory: animaxia-desktop). Keep the two
# in sync when changing scripts or targets.
#
#   verify (ubuntu) → lint + smoke + typecheck + renderer bundle
#   build  (matrix) → Linux .AppImage · Windows .exe · macOS .dmg
#   release (v* tag)→ installers attached to a GitHub Release

name: desktop-ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: desktop-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint + smoke + typecheck + renderer build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies (no Electron binary)
        run: bun install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: Guard lint
        run: bun run lint

      - name: Smoke suite (IPC parity, deep links, single-flight refresh, packaging)
        run: bun run test:smoke

      - name: Strict typecheck
        run: bun run typecheck

      - name: Renderer production bundle
        run: bun run build:renderer

      - name: Upload renderer bundle
        uses: actions/upload-artifact@v4
        with:
          name: renderer-bundle
          path: dist-renderer
          retention-days: 14

  build:
    name: ${{ matrix.name }} installer
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            script: build:linux
            artifact: 'Animaxia-*.AppImage'
            name: linux-appimage
          - os: windows-latest
            script: build:win
            artifact: 'Animaxia-Setup-*.exe'
            name: windows-installer
          - os: macos-latest
            script: build:mac
            artifact: 'Animaxia-*.dmg'
            name: macos-dmg
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build ${{ matrix.name }} installer
        run: bun run ${{ matrix.script }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: release/${{ matrix.artifact }}
          retention-days: 30
          if-no-files-found: error

  release:
    name: Attach installers to the GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all installers
        uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: installers/*
          generate_release_notes: true
